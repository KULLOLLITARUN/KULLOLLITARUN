<svg xmlns="http://www.w3.org/2000/svg" width="590" height="232" viewBox="0 0 590 232" role="img" aria-label="Markpull: Plain-English web extraction, with every record marked on the page. 30 of 30 Hacker News stories, each marked on the page">
  <style>
    .in{animation:cin .9s 0.46s cubic-bezier(.16,1,.3,1) both}@keyframes cin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .sweep{animation:sw 4.8s 1.8s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-240px)}60%,100%{transform:translateX(830px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5b544"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></linearGradient><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset="0.5" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient></defs>
  <g class="in">
  <rect x="0.5" y="0.5" width="589" height="231" rx="14" fill="#0c0c0e" stroke="#fff" stroke-opacity="0.12"/>
  <rect x="1" y="1" width="588" height="3" rx="1.5" fill="url(#top)" opacity="0.7"/>
  <rect class="sweep" x="0" y="1" width="240" height="3" rx="1.5" fill="url(#swg)"/>
  <text x="28" y="40" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" letter-spacing="2" fill="#f5b544">AGENT</text>
  <text x="28" y="76" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f4f4f5" letter-spacing="-0.4">Markpull</text>
  <text x="28" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">Plain-English web extraction, with every record marked on the</text><text x="28" y="121" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">page</text><circle cx="31" cy="152" r="3.5" fill="#f5b544"/><text x="44" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">30 of 30 Hacker News stories, each marked on the page</text><rect x="28" y="182" width="59" height="26" rx="13" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/><text x="57.5" y="199" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d4d4d8">Python</text><rect x="95" y="182" width="66" height="26" rx="13" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/><text x="127.8" y="199" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d4d4d8">FastAPI</text><rect x="168.5" y="182" width="85" height="26" rx="13" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/><text x="211.0" y="199" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d4d4d8">Playwright</text><rect x="261.5" y="182" width="46" height="26" rx="13" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/><text x="284.5" y="199" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d4d4d8">Groq</text><rect x="315.5" y="182" width="53" height="26" rx="13" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/><text x="341.8" y="199" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d4d4d8">React</text>
  </g>
</svg>
